<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Haushaltbuch Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    h1 { color: #333; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Haushaltbuch - Test</h1>
  <p>Wenn du das siehst, funktioniert die HTML!</p>
  <button onclick="testClick()">Test Button</button>
  <p id="output"></p>

  <script>
    console.log('✓ Script geladen');
    
    function testClick() {
      console.log('✓ Button geklickt');
      document.getElementById('output').innerHTML = 'Button funktioniert!';
    }
    
    // Test
    console.log('✓ Test läuft');
    document.getElementById('output').innerHTML = 'JavaScript funktioniert!';
  </script>
</body>
</html>
